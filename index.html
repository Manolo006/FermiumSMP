<!doctype html>
<html lang="it" class="dark scroll-smooth selection:bg-accent-orange/30 selection:text-white">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./Fermium_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fermium SMP — Technical Minecraft Community</title>
    <meta name="description" content="Fermium SMP è una community Technical Survival Multiplayer di Minecraft dedicata a redstone, farm su larga scala e progetti collaborativi." />
    <meta name="theme-color" content="#101216" />

    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fermium SMP — Technical Minecraft Community" />
    <meta property="og:description" content="Ingegneria, creatività, collaborazione e Technical Minecraft survival." />
    <meta property="og:image" content="./Fermium_logo.png" />

    <!-- Google Fonts: Space Grotesk, Inter, JetBrains Mono, Silkscreen -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-bg-main text-text-primary antialiased font-sans overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if (
        !document.querySelector('script[src*="assets/app.js"]') &&
        location.hostname !== 'localhost' &&
        location.hostname !== '127.0.0.1'
      ) {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = './dist/assets/index.css';
        document.head.appendChild(link);

        var script = document.createElement('script');
        script.type = 'module';
        script.src = './dist/assets/app.js';
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
